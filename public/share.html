<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mcview — Review</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .share-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .share-page-select {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; outline: none;
    }
  </style>
</head>
<body>
<div class="viewer-layout">

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="topbar-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168.534 12" fill="white" style="height:16px;width:auto;display:block"><text transform="translate(15.534)" font-size="11" font-family="BritannicBold, Britannic" letter-spacing="0.014em"><tspan x="0" y="10">mcview</tspan></text><path d="M-23018.812,988.506v5.6h5.67a13.751,13.751,0,0,1-3.965-2.379A6.437,6.437,0,0,1-23018.812,988.506Z" transform="translate(23024.749 -988.133)"/><path d="M0,0V5.6H5.671A13.751,13.751,0,0,1,1.707,3.22,6.43,6.43,0,0,1,0,0Z" transform="translate(5.671 11.832) rotate(180)"/><path d="M0,0V5.6H5.671A13.751,13.751,0,0,1,1.707,3.22,6.43,6.43,0,0,1,0,0Z" transform="translate(0.04 6.044) rotate(-90)"/><path d="M0,0V5.6H5.671A13.751,13.751,0,0,1,1.707,3.22,6.43,6.43,0,0,1,0,0Z" transform="translate(11.567 6.161) rotate(90)"/></svg></div>
    <div class="topbar-divider"></div>
    <span class="topbar-project" id="projectName">Loading…</span>
    <div class="topbar-divider"></div>
    <select class="share-page-select" id="pageSelect"></select>
    <div class="share-topbar-right">
      <span class="share-badge">Client Preview</span>
      <div class="zoom-toggle">
        <button class="zoom-btn" id="zoomFit">Fit</button>
        <button class="zoom-btn active" id="zoom100">100%</button>
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="viewer-body">
    <!-- Canvas -->
    <div class="canvas-area default-mode" id="canvasArea">
      <div class="no-pages hidden" id="noPages">
        <div class="big-icon">🖼️</div>
        <h2>No images</h2>
        <p>This project has no images yet.</p>
      </div>
      <div class="canvas-inner hidden" id="canvasInner">
        <img class="canvas-img" id="canvasImg" src="" alt="">
        <div class="retina-badge hidden" id="retinaBadge">@2x</div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Comments</div>
      </div>
      <div class="sidebar-scroll" id="sidebarScroll">
        <div class="sidebar-empty" id="sidebarEmpty">No comments yet.</div>
      </div>
    </aside>
  </div>
</div>

<!-- Add comment button -->
<button class="add-comment-btn" id="addCommentBtn" title="Add comment" style="display:none">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
</button>

<!-- Comment mode bar -->
<div class="comment-mode-bar hidden" id="commentModeBar">
  Click on the image to place a comment
  <button id="cancelCommentMode">Cancel (Esc)</button>
</div>

<!-- Client name picker modal -->
<div class="modal-backdrop hidden" id="clientPickerBackdrop">
  <div class="author-modal" id="clientPickerModal">
    <h3 style="margin-bottom:14px;">Bonjour ! Qui êtes-vous ?</h3>
    <!-- "Known user" view -->
    <div id="knownUserView" class="hidden">
      <p id="knownUserMsg" style="font-size:14px;margin-bottom:18px;"></p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" id="knownUserOui" style="flex:1;">Oui, c'est moi !</button>
        <button class="btn btn-ghost" id="knownUserNon" style="flex:1;">Ce n'est pas moi</button>
      </div>
    </div>
    <!-- "Choose / new" view -->
    <div id="chooseView">
      <div id="clientChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;"></div>
      <div id="newVisitorRow" style="margin-bottom:14px;">
        <button class="btn btn-ghost" id="newVisitorBtn" style="width:100%;">Nouveau visiteur</button>
      </div>
      <div id="newNameRow" class="hidden" style="margin-bottom:14px;">
        <input type="text" id="newNameInput" placeholder="Votre prénom…" class="nc-input" style="width:100%;margin-bottom:10px;">
        <button class="btn btn-primary" id="newNameConfirm" style="width:100%;">Confirmer</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/share.js"></script>
</body>
</html>
