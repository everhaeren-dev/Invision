<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mcview — Projects</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="dash-layout">
  <header class="dash-header">
    <div class="dash-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168.534 12" fill="white" style="height:18px;width:auto;display:block"><text transform="translate(15.534)" font-size="11" font-family="BritannicBold, Britannic" letter-spacing="0.014em"><tspan x="0" y="10">mcview</tspan></text><path d="M-23018.812,988.506v5.6h5.67a13.751,13.751,0,0,1-3.965-2.379A6.437,6.437,0,0,1-23018.812,988.506Z" transform="translate(23024.749 -988.133)"/><path d="M0,0V5.6H5.671A13.751,13.751,0,0,1,1.707,3.22,6.43,6.43,0,0,1,0,0Z" transform="translate(5.671 11.832) rotate(180)"/><path d="M0,0V5.6H5.671A13.751,13.751,0,0,1,1.707,3.22,6.43,6.43,0,0,1,0,0Z" transform="translate(0.04 6.044) rotate(-90)"/><path d="M0,0V5.6H5.671A13.751,13.751,0,0,1,1.707,3.22,6.43,6.43,0,0,1,0,0Z" transform="translate(11.567 6.161) rotate(90)"/></svg></div>
    <button class="btn btn-primary" id="newProjectBtn">+ New project</button>
    <form method="POST" action="/auth/logout" style="margin:0">
      <button type="submit" class="btn btn-ghost" style="font-size:13px">Log out</button>
    </form>
  </header>
  <main class="dash-main">
    <div class="dash-title">Projects</div>
    <div class="projects-grid" id="projectsGrid">
      <div class="new-project-card" id="newProjectCard">
        <div class="plus">+</div>
        <span>New project</span>
      </div>
    </div>
  </main>
</div>

<!-- New project modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="newProjectModal">
    <h2>New project</h2>
    <input type="text" id="projectNameInput" placeholder="Client name (e.g. McDonalds)">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="createBtn">Create</button>
    </div>
  </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
