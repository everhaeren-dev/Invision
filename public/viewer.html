<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InVision</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .topbar-left { display: flex; align-items: center; gap: 0; flex: 1; min-width: 0; }
    .upload-btn { position: relative; overflow: hidden; }
    .upload-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
  </style>
</head>
<body>
<div class="viewer-layout" id="viewerLayout">

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <a href="/" class="topbar-logo">InVision</a>
      <div class="topbar-divider"></div>
      <button class="btn-icon" id="backToScreens" style="display:none;color:var(--text2);font-size:13px">&#8592; Pages</button>
      <div class="topbar-divider" id="divBack" style="display:none"></div>
      <span class="topbar-project" id="projectName">Loading…</span>
      <div class="topbar-divider" id="divSelect" style="display:none"></div>
      <select class="page-select" id="pageSelect" style="display:none"></select>
    </div>
    <div class="topbar-right">
      <div class="zoom-toggle" id="zoomSection" style="display:none">
        <button class="zoom-btn" id="zoomFit">Fit</button>
        <button class="zoom-btn active" id="zoom100">100%</button>
      </div>
      <label class="btn btn-ghost btn-icon upload-btn" title="Add images">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button class="share-btn" id="shareBtn">Share</button>
    </div>
  </header>

  <!-- Screens overview (shown on first open) -->
  <div id="screensView" class="screens-view" style="display:none">
    <div class="screens-header">
      <h1 id="screensTitle"></h1>
      <p class="screens-subtitle" id="screensSubtitle"></p>
    </div>
    <div class="screens-grid" id="screensGrid"></div>
    <div class="no-pages hidden" id="noPagesScreens" style="position:static;flex:none;margin-top:60px">
      <div class="big-icon">🖼️</div>
      <h2>No images yet</h2>
      <p>Upload your first JPG to get started, or drag & drop images anywhere on this page.</p>
    </div>
  </div>

  <!-- Viewer (canvas + sidebar) -->
  <div class="viewer-body" id="viewerBody" style="display:none;min-height:0">
    <div class="canvas-area default-mode" id="canvasArea">
      <div class="canvas-inner hidden" id="canvasInner">
        <img class="canvas-img" id="canvasImg" src="" alt="">
        <div class="retina-badge hidden" id="retinaBadge">@2x</div>
      </div>
    </div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Comments</div>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="team">Team</button>
          <button class="filter-tab" data-filter="client">Client</button>
        </div>
      </div>
      <div class="sidebar-scroll" id="sidebarScroll"></div>
    </aside>
  </div>

  <!-- Bottom pages strip (viewer mode only) -->
  <div class="bottom-bar" id="bottomBar" style="display:none"></div>

</div>

<!-- Add comment button -->
<button class="add-comment-btn" id="addCommentBtn" title="Add comment" style="display:none">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
</button>

<!-- Comment mode bar -->
<div class="comment-mode-bar hidden" id="commentModeBar">
  Click on the image to place a comment
  <button id="cancelCommentMode">Cancel (Esc)</button>
</div>

<!-- Drop overlay -->
<div class="drop-overlay hidden" id="dropOverlay">
  <div class="drop-icon">⬆️</div>
  <div class="drop-text">Drop images here</div>
  <div class="drop-sub">JPG, PNG, GIF, WebP — @2x supported</div>
</div>

<!-- Share toast -->
<div class="toast hidden" id="shareToast">
  <button class="toast-close" id="shareToastClose">&times;</button>
  <div class="toast-title">Share with client</div>
  <div class="toast-url">
    <input type="text" id="shareUrl" readonly>
    <button id="copyShareUrl">Copy</button>
  </div>
</div>

<!-- Upload progress -->
<div class="upload-progress hidden" id="uploadProgress">
  <p>Uploading…</p>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<script src="/js/viewer.js"></script>
</body>
</html>
